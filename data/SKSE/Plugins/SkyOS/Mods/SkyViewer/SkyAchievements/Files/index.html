<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkyAchievements · SkyViewer</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10171d;color:#eaf0ef;font:15px/1.65 'Segoe UI',sans-serif}
    main{width:100%;max-width:none;padding:20px}.hero{position:relative;isolation:isolate;display:flex;align-items:center;min-height:190px;overflow:hidden;padding:22px;border:1px solid #9f7c4366;border-radius:12px;background:#182127}
    .hero:before{position:absolute;z-index:-2;inset:0;content:'';background:url('{{SKYOS_BANNER}}') center/cover;opacity:.58}.hero:after{position:absolute;z-index:-1;inset:0;content:'';background:linear-gradient(90deg,#10151bea,#10151ab8 70%,#10151a55)}
    .brand{display:flex;align-items:center;gap:18px}.brand img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 5px 16px #000b)}.eyebrow{font:11px Consolas,monospace;letter-spacing:.15em;text-transform:uppercase;color:#71d8e3}h1{margin:4px 0;color:#e7b965}p{color:#c3cdd0}.card{margin-top:15px;padding:16px;border:1px solid #46535c;border-radius:10px;background:#172127}h2{font-size:15px}
  </style>
</head>
<body>
  <main>
    <header class="hero"><div class="brand"><img src="{{SKYOS_LOGO}}" alt="SkyAchievements logo"><div><p class="eyebrow">CHARACTER RECORD &amp; DISCOVERIES</p><h1>SkyAchievements</h1><p>Current character stats with available quest, combat, location, and item history.</p></div></div></header>
    <section class="card"><h2>Character record</h2><p>Open SkyAchievements from SkyOS to review your character snapshot and history supplied by installed SkyOS apps.</p></section>
  </main>
</body>
</html>
